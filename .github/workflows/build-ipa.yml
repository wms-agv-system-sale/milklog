name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -e
          LATEST=$(ls /Applications | grep -E '^Xcode' | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "/Applications/$LATEST"; fi
          xcodebuild -version

      - name: Build (no code signing)
        run: |
          set -e
          xcodebuild \
            -project MilkLog.xcodeproj \
            -scheme MilkLog \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MilkLog.app Payload/
          zip -qry MilkLog.ipa Payload
          rm -rf Payload
          ls -lh MilkLog.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MilkLog-ipa
          path: MilkLog.ipa
          if-no-files-found: error

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: MilkLog IPA
          body: Auto-built IPA for sideloading.
          files: MilkLog.ipa